plugins {
    id 'com.android.application'
    id 'kotlin-android'
}

// A release is a git tag like v0.1.0, which CI passes as -PappVersion=0.1.0
def appVersion = (findProperty('appVersion') ?: '0.0.1').toString()
def (major, minor, patch) = appVersion.tokenize('.-').take(3).collect { it.toInteger() }

// The release key: android/keystore.properties here, environment variables in CI
def keystore = new Properties()
def keystoreFile = rootProject.file('keystore.properties')
if (keystoreFile.exists()) keystoreFile.withInputStream { keystore.load(it) }

android {
    kotlinOptions {
        jvmTarget = '21'
    }
    namespace = "com.nouture.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId = "com.meowmeowteam.nouture"
        minSdk = rootProject.ext.minSdkVersion
        targetSdk = rootProject.ext.targetSdkVersion
        // Must grow with every release: Android refuses to downgrade
        versionCode = major * 10000 + minor * 100 + patch
        versionName = appVersion
        // Unison is only built for arm64: other phones can't install the app,
        // rather than installing one that can't sync
        ndk { abiFilters 'arm64-v8a' }
        testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            def store = keystore.storeFile ?: System.getenv('KEYSTORE_FILE')
            if (store) {
                storeFile = rootProject.file(store)
                storePassword = keystore.storePassword ?: System.getenv('KEYSTORE_PASSWORD')
                keyAlias = keystore.keyAlias ?: System.getenv('KEY_ALIAS')
                keyPassword = keystore.keyPassword ?: System.getenv('KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        debug {
            // A separate app next to the released one: same-id installs with
            // another key would make `cap run` uninstall it, data and all
            applicationIdSuffix = ".debug"
            versionNameSuffix = "-dev"
        }
        release {
            minifyEnabled = false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (signingConfigs.release.storeFile) {
                signingConfig = signingConfigs.release
            }
        }
    }
    packagingOptions {
        jniLibs {
            // unison and noussh are executables; they must be extracted to run
            useLegacyPackaging = true
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
    implementation 'com.github.mwiede:jsch:2.28.7'
    implementation 'org.bouncycastle:bcprov-jdk15to18:1.86'
    implementation 'androidx.work:work-runtime-ktx:2.11.2'
}

apply from: 'capacitor.build.gradle'
apply plugin: 'org.jetbrains.kotlin.android'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
